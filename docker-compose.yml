version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: hospital_crm_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hospital_crm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hospital_crm"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: hospital_crm_web
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/hospital_crm
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: